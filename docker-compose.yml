# Compose ini hanya menjalankan api. Database-nya server Postgres yang sudah ada
# (tidak ikut di compose), dan migrasi dijalankan MANUAL dari laptop:
#
#   1. npx prisma migrate deploy --config prisma7.config.ts   # setiap ada migration baru
#   2. docker compose up -d --build
#
# DATABASE_URL diambil dari .env, lalu (kalau ada) ditimpa oleh .env.docker.
# Ingat: `localhost` di dalam container = container itu sendiri. Kalau Postgres
# terpasang di laptop sendiri, .env tetap `localhost` (untuk start:dev & migrasi)
# dan .env.docker berisi host.docker.internal. Contoh: env_docker_template.

services:
  app:
    container_name: todolist-nestjs
    image: todolist-nestjs:0.5.6
    build: .
    env_file:
      - .env
      - path: .env.docker # menimpa DATABASE_URL khusus container
        required: false
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET wajib diisi di .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-3600}
    ports:
      - '${PORT:-3001}:3000'
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"